name: Task 1 contracts verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/task1-contracts.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "packages/contracts/**"
  workflow_dispatch:

concurrency:
  group: usshm-contracts-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  contracts:
    name: Node 24 / workspace contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install supported Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build contracts
        run: npm run build
