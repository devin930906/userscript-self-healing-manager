name: Report publication integrity (no installers)

on:
  pull_request:
    branches: [feat/v01-continuation]
    paths:
      - 'packages/reporting/**'
      - '.github/workflows/report-publication-ci.yml'

permissions:
  contents: read

concurrency:
  group: usshm-report-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-integrity:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Locked dependency installation
        run: npm ci
      - name: Report publication regression and existing report tests
        run: node --experimental-strip-types --test packages/reporting/test/exclusive-report-publication-race.test.ts packages/reporting/test/exclusive-report.test.ts
      - name: Full repository regression suite
        run: npm test
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Electron build without installer
        run: npm run build
