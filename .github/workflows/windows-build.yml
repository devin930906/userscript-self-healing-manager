name: Windows three-edition final-tag-only verification
on:
  workflow_dispatch:
  pull_request:
    branches: [feat/v01-continuation]
concurrency:
  group: usshm-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  release-contracts:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Release gate tests only (no installers or uploads)
        run: node --experimental-strip-types --test tests/integration/windows-release-evidence.test.ts tests/integration/final-build-authorization.test.ts tests/integration/distribution.test.ts tests/integration/packaged-startup.test.ts tests/integration/windows-command.test.ts apps/desktop/tests/windows-release-gate.test.ts apps/desktop/tests/three-target-release-contract.test.ts
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Block branch or prerelease packaging before installing anything
        env:
          USSHM_BUILD_REF: ${{ github.ref }}
          USSHM_BUILD_EVENT: ${{ github.event_name }}
          USSHM_BUILD_SHA: ${{ github.sha }}
        run: node scripts/final-build-authorization.mjs
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Full TypeScript typecheck
        run: npm run typecheck
      - name: Bundle desktop
        run: npm run build
      - name: Build Setup and Portable EXEs
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create complete unpacked ZIP portable application
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $unpacked = Resolve-Path 'release/win-unpacked'
          if (Test-Path -LiteralPath "$unpacked/Data") { throw 'Refuse to include private Data in release ZIP' }
          Set-Content -NoNewline -Path "$unpacked/.usshm-portable" -Value 'zip-portable-v1'
          $zip = Join-Path (Resolve-Path 'release') "Userscript-Self-Healing-Manager-$version-win-x64.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($unpacked, $zip)
          if (!(Test-Path $zip)) { throw "Missing ZIP: $zip" }
          if (!(Test-Path "$unpacked/resources/app.asar")) { throw 'Missing packaged app resources' }
      - name: Verify final three-edition release inventory, ZIP and SHA256 checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/windows-release-gate.mjs $version release
      - name: Extract and compare the actual ZIP payload before any package smoke
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $zip = Join-Path 'release' "Userscript-Self-Healing-Manager-$version-win-x64.zip"
          $target = Join-Path $env:RUNNER_TEMP 'usshm-verified-zip'
          if (Test-Path -LiteralPath $target) { throw 'Release extraction target already exists' }
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          # Prior inventory gate has already validated names and ZIP entry types.
          Expand-Archive -LiteralPath $zip -DestinationPath $target
          node scripts/windows-release-gate.mjs --verify-extracted release/win-unpacked $target
      - name: Smoke-check unpacked Windows executable
        shell: pwsh
        run: |
          $root = (Resolve-Path (Join-Path $env:RUNNER_TEMP 'usshm-verified-zip')).Path
          $exe = Join-Path $root 'Userscript-Self-Healing-Manager.exe'
          if (!(Test-Path $exe)) { throw "Missing unpacked EXE" }
          $database = Join-Path $root 'Data/registry.sqlite'
          if (Test-Path -LiteralPath (Join-Path $root 'Data')) { throw 'ZIP smoke found pre-existing Data in extracted release' }
          $proc = $null
          try {
            $proc = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
            $ok = $false
            for ($i=0; $i -lt 20; $i++) {
              if ($proc.HasExited) { throw "Packaged EXE exited before database initialization, exit $($proc.ExitCode)" }
              if ((Test-Path -LiteralPath $database) -and (Get-Item -LiteralPath $database).Length -gt 0) { $ok = $true; break }
              Start-Sleep -Seconds 1
            }
            if (!$ok) { throw "Packaged application did not initialize portable registry.sqlite" }
            $journal = Join-Path $root 'Data/diagnosis-journal.sqlite'
            $journalReady = $false
            for ($i = 0; $i -lt 15; $i++) {
              if ($proc.HasExited) { throw 'Unpacked ZIP exited before diagnosis history initialization' }
              if ((Test-Path -LiteralPath $journal) -and (Get-Item -LiteralPath $journal).Length -gt 0) { $journalReady = $true; break }
              Start-Sleep -Seconds 1
            }
            if (!$journalReady) { throw 'Unpacked ZIP did not initialize diagnosis history SQLite' }
            Start-Sleep -Seconds 3
            if ($proc.HasExited) { throw 'Unpacked ZIP exited immediately after initializing databases' }
            Write-Host 'Smoke PASS: unpacked ZIP portable EXE initialized registry.sqlite'
          } finally {
            if ($proc -and !$proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction Stop
              $proc.WaitForExit(10000) | Out-Null
              if (!$proc.HasExited) { throw 'Portable smoke process did not terminate' }
            }
          }
      - name: Smoke-check single-file Portable EXE
        shell: pwsh
        run: |
          $portable = Get-ChildItem release -File -Filter '*-Portable-*.exe' | Select-Object -First 1
          if (!$portable) { throw 'Missing Portable.exe' }
          $root = Join-Path $env:RUNNER_TEMP 'usshm-portable-exe-smoke'
          if (Test-Path -LiteralPath $root) { throw 'Portable EXE smoke requires a fresh directory without prior Data' }
          New-Item -Path $root -ItemType Directory | Out-Null
          $exe = Join-Path $root $portable.Name
          Copy-Item $portable.FullName $exe -Force
          $db = Join-Path $root 'Data/registry.sqlite'
          $proc = $null
          try {
            $proc = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) { throw "Portable EXE exited before database initialization: $($proc.ExitCode)" }
              if ((Test-Path -LiteralPath $db) -and (Get-Item -LiteralPath $db).Length -gt 0) { $ok = $true; break }
              Start-Sleep -Seconds 1
            }
            if (!$ok) { throw 'Portable single-file EXE did not initialize nonempty adjacent Data/registry.sqlite' }
            $journal = Join-Path $root 'Data/diagnosis-journal.sqlite'
            $journalReady = $false
            for ($i = 0; $i -lt 15; $i++) {
              if ($proc.HasExited) { throw 'Portable EXE exited before diagnosis history initialization' }
              if ((Test-Path -LiteralPath $journal) -and (Get-Item -LiteralPath $journal).Length -gt 0) { $journalReady = $true; break }
              Start-Sleep -Seconds 1
            }
            if (!$journalReady) { throw 'Portable EXE did not initialize diagnosis history SQLite' }
            Start-Sleep -Seconds 3
            if ($proc.HasExited) { throw 'Portable EXE exited immediately after initializing databases' }
            Write-Host 'Smoke PASS: Portable EXE initialized data beside external EXE'
          } finally {
            if ($proc -and !$proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction Stop
              $proc.WaitForExit(10000) | Out-Null
              if (!$proc.HasExited) { throw 'Portable smoke process did not terminate' }
            }
          }
      - name: Smoke-check NSIS Setup installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -File -Filter '*-Setup-*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Missing Setup.exe' }
          $root = Join-Path $env:RUNNER_TEMP 'usshm-setup-smoke'
          if (Test-Path -LiteralPath $root) { throw 'Setup smoke requires a fresh install destination' }
          $installed = Join-Path $root 'Userscript-Self-Healing-Manager.exe'
          # NSIS /D must be the last argument and is intentionally unquoted.
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S',"/D=$root") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed with code $($install.ExitCode)" }
          if (!(Test-Path $installed)) { throw 'NSIS install did not create the desktop executable' }
          $running = $null
          $previousAppData = $env:APPDATA
          $isolatedAppData = Join-Path $env:RUNNER_TEMP 'usshm-installed-appdata-smoke'
          if (Test-Path -LiteralPath $isolatedAppData) { throw 'Setup smoke requires an unused APPDATA directory' }
          New-Item -Path $isolatedAppData -ItemType Directory | Out-Null
          try {
            # Use a new APPDATA tree; never confuse existing developer files with evidence.
            $env:APPDATA = $isolatedAppData
            $running = Start-Process -FilePath $installed -WorkingDirectory $root -PassThru
            $initialized = $false
            for ($i = 0; $i -lt 20; $i++) {
              if ($running.HasExited) { throw "Installed EXE exited unexpectedly: $($running.ExitCode)" }
              $databases = @(Get-ChildItem -LiteralPath $isolatedAppData -Filter 'registry.sqlite' -Recurse -File -ErrorAction Stop)
              if ($databases.Count -eq 1 -and $databases[0].Length -gt 0) { $initialized = $true; break }
              Start-Sleep -Seconds 1
            }
            if (!$initialized) { throw 'Installed EXE did not initialize exactly one SQLite registry in isolated APPDATA' }
            $journalPath = Join-Path (Split-Path -Parent $databases[0].FullName) 'diagnosis-journal.sqlite'
            $journalReady = $false
            for ($i = 0; $i -lt 15; $i++) {
              if ($running.HasExited) { throw 'Installed EXE exited before diagnosis journal initialization' }
              if ((Test-Path -LiteralPath $journalPath) -and (Get-Item -LiteralPath $journalPath).Length -gt 0) { $journalReady = $true; break }
              Start-Sleep -Seconds 1
            }
            if (!$journalReady) { throw 'Installed EXE did not initialize nonempty diagnosis journal' }
            Start-Sleep -Seconds 3
            if ($running.HasExited) { throw 'Installed EXE exited immediately after initializing databases' }
            if (Test-Path -LiteralPath (Join-Path $root 'Data')) { throw 'Installed edition unexpectedly created portable Data beside EXE' }
            Write-Host 'Smoke PASS: installed EXE initialized SQLite in isolated APPDATA'
          } finally {
            try {
              if ($running -and !$running.HasExited) {
                Stop-Process -Id $running.Id -Force -ErrorAction Stop
                $running.WaitForExit(10000) | Out-Null
                if (!$running.HasExited) { throw 'Installed smoke process did not terminate before data integrity checks' }
              }
            } finally {
              $env:APPDATA = $previousAppData
            }
          }
          # Keep the installed user's data path for post-uninstall retention checks.
          $installedRegistry = $databases[0].FullName
          $registryHashBeforeUninstall = (Get-FileHash -LiteralPath $installedRegistry -Algorithm SHA256).Hash
          $journalHashBeforeUninstall = (Get-FileHash -LiteralPath $journalPath -Algorithm SHA256).Hash
          $uninstaller = Get-ChildItem -Path $root -File -Filter '*Uninstall*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'NSIS uninstaller is missing' }
          $removed = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/S') -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "NSIS uninstall failed: $($removed.ExitCode)" }
          $uninstallCleared = $false
          for ($i = 0; $i -lt 10; $i++) {
            if (!(Test-Path -LiteralPath $installed)) { $uninstallCleared = $true; break }
            Start-Sleep -Seconds 1
          }
          if (!$uninstallCleared) { throw 'NSIS uninstall left installed executable behind' }
          if (!(Test-Path -LiteralPath $installedRegistry)) { throw 'NSIS uninstall deleted user SQLite registry' }
          $registryHashAfterUninstall = (Get-FileHash -LiteralPath $installedRegistry -Algorithm SHA256).Hash
          if ($registryHashAfterUninstall -ne $registryHashBeforeUninstall) { throw 'NSIS uninstall modified user SQLite registry' }
          if (!(Test-Path -LiteralPath $journalPath)) { throw 'NSIS uninstall deleted diagnosis journal' }
          $journalHashAfterUninstall = (Get-FileHash -LiteralPath $journalPath -Algorithm SHA256).Hash
          if ($journalHashAfterUninstall -ne $journalHashBeforeUninstall) { throw 'NSIS uninstall modified diagnosis journal' }
          Write-Host 'Smoke PASS: NSIS uninstall removed application and retained user SQLite data'
      - name: Verify initialized SQLite file signatures across all Windows editions
        shell: pwsh
        run: |
          $roots = @(
            (Join-Path $env:RUNNER_TEMP 'usshm-verified-zip/Data'),
            (Join-Path $env:RUNNER_TEMP 'usshm-portable-exe-smoke/Data')
          )
          $installedData = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'usshm-installed-appdata-smoke') -Filter 'registry.sqlite' -Recurse -File -ErrorAction Stop)
          if ($installedData.Count -ne 1) { throw 'Expected exactly one installed SQLite registry for signature inspection' }
          $roots += (Split-Path -Parent $installedData[0].FullName)
          foreach ($root in $roots) {
            foreach ($name in @('registry.sqlite', 'diagnosis-journal.sqlite')) {
              $db = Join-Path $root $name
              if (!(Test-Path -LiteralPath $db)) { throw "Missing SQLite database: $db" }
              $stream = [System.IO.File]::Open($db, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
              try {
                $header = [byte[]]::new(16)
                if ($stream.Read($header, 0, 16) -ne 16 -or [System.Text.Encoding]::ASCII.GetString($header) -ne "SQLite format 3`0") {
                  throw "Invalid SQLite file signature: $db"
                }
              } finally {
                $stream.Dispose()
              }
            }
          }
      - name: Record signatures and explicitly unverified Stable gates
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $setup = Join-Path 'release' "Userscript-Self-Healing-Manager-Setup-$version-win-x64.exe"
          $portable = Join-Path 'release' "Userscript-Self-Healing-Manager-Portable-$version-win-x64.exe"
          $report = [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            version = $version
            runnerOS = [System.Environment]::OSVersion.VersionString
            threeFileInventory = 'passed-on-ci'
            extractedZipByteMatch = 'passed-on-ci'
            setupAuthenticodeStatus = (Get-AuthenticodeSignature -LiteralPath $setup).Status.ToString()
            portableAuthenticodeStatus = (Get-AuthenticodeSignature -LiteralPath $portable).Status.ToString()
            userWindows10Chrome155_0_8059_40 = 'not-verified'
            realTampermonkeyGM = 'not-verified'
            stableApproved = $false
            pending = 'Independent DIST-001..014 and RG-01..09 audit'
          }
          $report | ConvertTo-Json | Set-Content -Path release/windows-verification-evidence.json -Encoding utf8
      - name: Upload tag-only artifacts for independent RG audit (not automatically Stable)
        uses: actions/upload-artifact@v4
        with:
          name: usshm-windows-three-editions-final-RG-audit-required
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/windows-verification-evidence.json
          if-no-files-found: error
          retention-days: 7
