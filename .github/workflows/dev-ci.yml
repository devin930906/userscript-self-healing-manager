name: Development CI (no intermediate installers)
on:
  push:
    branches: [feat/v01-continuation]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: usshm-development-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run all tests
        run: npm test
      - name: Strict TypeScript checks
        run: npm run typecheck
      - name: Build renderer and Electron entrypoint
        run: npm run build
